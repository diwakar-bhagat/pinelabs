org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# No org.gradle.java.home here: a machine-specific JDK path breaks other machines (Windows).
# Android Studio uses its bundled JDK; on the command line set JAVA_HOME, or put
# org.gradle.java.home in your user-level ~/.gradle/gradle.properties.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

